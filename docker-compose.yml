services:
  blocklogs:
    build:
      context: .
      # block-ui is a sibling checkout until it is installed from GitHub.
      additional_contexts:
        block-ui: ../block-ui
    image: blocklogs
    restart: unless-stopped
    env_file: .env
    ports:
      # No built-in auth: only expose it to your reverse proxy / localhost.
      - "127.0.0.1:3000:3000"
    volumes:
      - blocklogs-data:/data

volumes:
  blocklogs-data:
